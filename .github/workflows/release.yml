name: Release Markdown Viewer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.1.2)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS Application & Package Distribution Zip
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Calculate Distribution SHA-256
        id: checksum
        run: |
          SHA=$(shasum -a 256 dist/MarkdownViewer-macOS.zip | awk '{print $1}')
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT
          echo "Computed SHA-256: ${SHA}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarkdownViewer-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
